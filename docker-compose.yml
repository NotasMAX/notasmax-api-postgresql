services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-notasmax}
      POSTGRES_USER: ${PGUSER:-notasmax}
      POSTGRES_PASSWORD: ${PGPASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-notasmax} -d ${PGDATABASE:-notasmax}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
